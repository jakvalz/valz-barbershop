name: Deploy VALZ to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Publishes the Vite build to the gh-pages branch.
# Repo setting required: Settings → Pages → Source = Deploy from a branch → gh-pages / (root).
# Do not use “Deploy from a branch → main” — that serves source and breaks the site.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false
